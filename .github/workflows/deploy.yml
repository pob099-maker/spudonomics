name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /spudonomics/
          # Publishable/anon key, not a secret — Postgres row-level security
          # (see the spudonomics_survey_responses_to_public_schema migration) is what actually
          # restricts it to inserting a Contribute-form response and reading
          # the aggregated response counter, never an individual row.
          VITE_SUPABASE_URL: https://wqyjpgjztaiigyjijdxt.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_68329GCd2IUzuMn9hcjq6w_SqSrKR8I
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
